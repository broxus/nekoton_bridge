name: Publish FNB Release

on:
  push:
    tags:
      - 'flutter_nekoton_bridge-v*'

permissions:
  contents: write

jobs:
  publish_github_release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2

  publish_pub_release:
    needs: publish_github_release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # This is required for authentication using OIDC

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'
          cache: true
          cache-key: flutter-:os:-:channel:-:version:-:arch:-:hash:-${{ hashFiles('**/pubspec.lock') }}
      - uses: bluefireteam/melos-action@v3
      # flutter_nekoton_bridge is published from its own tag, whose tree cannot
      # contain the release checksum yet (the XCFramework is built/uploaded by
      # publish-release-nb.yml in parallel). Inject the checksum into the
      # working tree before publishing so the SwiftPM remote binary target in the
      # published package matches the released archive. The script waits/retries
      # until the archive is available.
      #
      # This step can wait for many minutes. It MUST run before `setup-dart`,
      # because `setup-dart` mints the short-lived OIDC token used to authenticate
      # with pub.dev. If a long wait happened after token creation, the token
      # would expire before `pub publish` runs ("Invalid JWT token: invalid
      # timestamps").
      - name: Embed SwiftPM XCFramework checksum
        run: bash scripts/spm-checksum.sh
      # pub publish refuses to publish from a dirty git tree. The checksum is
      # injected into a checked-in file, so commit it locally (no push) to make
      # the working tree clean before publishing.
      - name: Commit injected checksum locally
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/flutter_nekoton_bridge/ios/flutter_nekoton_bridge/Package.swift
          git commit -m "ci: embed SwiftPM checksum for release" || echo "No changes to commit"
      # Mint the OIDC token last, right before publishing, so it doesn't expire
      # while the checksum step waits for the release archive.
      - uses: dart-lang/setup-dart@v1
      - name: Dry-run publish to pub.dev
        run: melos publish -y --dry-run --scope="flutter_nekoton_bridge"
      - name: Publish to pub.dev
        run: melos publish -y --no-dry-run --scope="flutter_nekoton_bridge"
